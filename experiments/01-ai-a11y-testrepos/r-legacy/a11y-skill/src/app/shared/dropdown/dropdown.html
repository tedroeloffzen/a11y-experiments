<div class="dropdown">
  <div class="dropdown-toggle" (click)="toggle()">
    {{ selectedLabel() }}
    <span class="caret">▾</span>
  </div>
  @if (open()) {
    <div class="dropdown-menu">
      @for (option of options(); track option.value) {
        <div
          class="dropdown-item"
          [class.selected]="option.value === value()"
          (click)="select(option)"
        >
          {{ option.label }}
        </div>
      }
    </div>
  }
</div>
